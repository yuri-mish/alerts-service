<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Документація API історії повітряних тривог</title>
    <meta
      name="description"
      content="Інтерактивна документація API історії повітряних тривог: /1c/alerts, /periods, /summary. Спробуйте запити просто в браузері зі своїм ключем."
    />
    <link rel="canonical" href="https://alerts.starsam.net/docs" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/docs/assets/swagger-ui.css" />
    <style>
      body {
        margin: 0;
        background: #fff;
        font-family: system-ui, sans-serif;
      }
      .top {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        padding: 12px max(16px, env(safe-area-inset-left, 0px));
        border-bottom: 1px solid #e3e6ea;
        font-size: 14px;
      }
      .top a {
        color: #1f5fbf;
        text-decoration: none;
      }
      .top a:hover {
        text-decoration: underline;
      }
      .hint {
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <a href="/">← API історії повітряних тривог</a>
      <span class="hint">Натисніть «Authorize», вставте свій ключ — і «Try it out» у будь-якому запиті</span>
    </div>
    <div id="swagger-ui"></div>
    <script src="/docs/assets/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: '/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        persistAuthorization: true,
        tryItOutEnabled: false,
        defaultModelsExpandDepth: 0,
      });
    </script>
  </body>
</html>
